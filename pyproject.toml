[project]
name = "chebilp"
version = "1.0.0"
description = "An Inductive Logic Programming framework for classifying chemical compounds into ChEBI classes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chebi-utils>=0.1.1",
    "popper-ilp@git+https://github.com/logic-and-learning-lab/Popper#egg=main",
    "bitarray>=3.8.0",
    "clingo>=5.8.0",
    "janus-swi>=1.5.2",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "rdkit>=2025.9.6",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
explain = [
    "xclingo>=2.0b14",
    "Pillow>=12.1.1",
]
llm = [
    "anthropic>=0.104.1",
    "langsmith>=0.8.5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
chebILP = "chebILP.cli:main"

[tool.setuptools.packages.find]
include = ["chebILP*"]
