[project]
name = "chebilp"
version = "1.0.2"
description = "An Inductive Logic Programming framework for classifying chemical compounds into ChEBI classes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chebi-utils>=0.2.1",
    "clingo>=5.8.0",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "rdkit>=2025.9.6",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
explain = [
    "xclingo>=2.0b14",
    "Pillow>=12.1.1",
]
llm = [
    "anthropic>=0.104.1",
    "claude-agent-sdk>=0.2.87",
    "langsmith>=0.8.5",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
]

[project.scripts]
chebILP = "chebILP.cli:main"

[tool.setuptools.packages.find]
include = ["chebILP*"]
